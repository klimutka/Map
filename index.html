<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта Скайрима (Общая)</title>
    <!-- Подключаем стили Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Georgia', serif;
        }

        /* Модальные окна */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #f4ebd0;
            border: 3px solid #5a4521;
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            color: #2c221e;
        }
        .auth-card h3 {
            margin-top: 0;
            border-bottom: 2px solid #5a4521;
            padding-bottom: 8px;
        }
        .auth-card input, .auth-card select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #5a4521;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            background: #fff;
        }
        .auth-card button {
            background: #5a4521;
            color: #f4ebd0;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-top: 5px;
        }
        .auth-card button:hover {
            background: #73592c;
        }
        .btn-secondary {
            background: #8c7355 !important;
            margin-top: 8px !important;
        }
        .btn-secondary:hover {
            background: #5a4521 !important;
        }

        /* Кнопки управления в левом нижнем углу */
        .bottom-left-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .map-control-btn {
            background: #5a4521;
            color: #f4ebd0;
            border: 2px solid #3b2a1a;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-family: 'Georgia', serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-size: 13px;
            text-align: left;
        }
        .map-control-btn:hover {
            background: #73592c;
        }

        /* Список пользователей в админке */
        .users-list {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            background: #e8dbbc;
            padding: 6px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 12px;
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            border-bottom: 1px dashed #5a4521;
        }
        .user-row:last-child {
            border-bottom: none;
        }
        .del-user-btn {
            background: #a83232;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        /* Панель информации (справа сверху) */
        .info-panel {
            position: absolute;
            top: 10px; right: 10px;
            z-index: 1000;
            background: #f4ebd0;
            border: 2px solid #5a4521;
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 270px;
            font-size: 13px;
            color: #2c221e;
        }
        .info-panel .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #5a4521; padding-bottom: 3px; margin-bottom: 5px;
        }
        .close-btn {
            background: #5a4521; color: #f4ebd0; border: none; border-radius: 3px;
            width: 20px; height: 20px; cursor: pointer; font-weight: bold;
        }

        /* Боковые панели */
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #5a4521; padding-bottom: 3px; margin-bottom: 8px;
        }
        .collapse-btn {
            background: #5a4521; color: #f4ebd0; border: none; border-radius: 3px;
            width: 20px; height: 20px; cursor: pointer; font-weight: bold;
        }

        .filter-panel, .diplomacy-panel {
            position: absolute; z-index: 1000; background: #f4ebd0;
            border: 2px solid #5a4521; padding: 10px 15px; border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 13px; color: #2c221e;
            transition: width 0.2s, padding 0.2s; overflow-y: auto;
        }
        .filter-panel { top: 10px; left: 60px; width: 240px; max-height: 90vh; }
        .diplomacy-panel { top: 160px; right: 10px; width: 270px; max-height: 70vh; }

        .filter-panel.collapsed, .diplomacy-panel.collapsed {
            width: 35px; padding: 10px 6px; overflow: hidden;
        }
        .filter-panel.collapsed .panel-content, .diplomacy-panel.collapsed .panel-content,
        .filter-panel.collapsed h4, .diplomacy-panel.collapsed h4 { display: none; }

        .city-diplo-item {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 6px; background: #e8dbbc; padding: 5px 8px; border-radius: 4px;
        }

        /* Свечение карточек */
        @keyframes pulse-card-ally { 0% { box-shadow: 0 0 3px rgba(46, 204, 113, 0.4); } 50% { box-shadow: 0 0 10px rgba(46, 204, 113, 0.85); } 100% { box-shadow: 0 0 3px rgba(46, 204, 113, 0.4); } }
        @keyframes pulse-card-neutral { 0% { box-shadow: 0 0 3px rgba(241, 196, 15, 0.4); } 50% { box-shadow: 0 0 10px rgba(241, 196, 15, 0.85); } 100% { box-shadow: 0 0 3px rgba(241, 196, 15, 0.4); } }
        @keyframes pulse-card-enemy { 0% { box-shadow: 0 0 3px rgba(231, 76, 60, 0.4); } 50% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.85); } 100% { box-shadow: 0 0 3px rgba(231, 76, 60, 0.4); } }

        .diplo-card-ally { animation: pulse-card-ally 2.5s infinite; border: 1px solid #2ecc71; }
        .diplo-card-neutral { animation: pulse-card-neutral 2.5s infinite; border: 1px solid #f1c40f; }
        .diplo-card-enemy { animation: pulse-card-enemy 2.5s infinite; border: 1px solid #e74c3c; }

        .filter-icon { width: 20px; height: 20px; margin-right: 6px; vertical-align: middle; object-fit: contain; }
        .color-ally { filter: invert(48%) sepia(79%) saturate(382%) hue-rotate(86deg) brightness(98%) contrast(92%); }
        .color-neutral { filter: invert(74%) sepia(85%) saturate(848%) hue-rotate(359deg) brightness(103%) contrast(93%); }
        .color-enemy { filter: invert(27%) sepia(85%) saturate(2284%) hue-rotate(345deg) brightness(97%) contrast(92%); }

        .popup-title { font-weight: bold; font-size: 15px; border-bottom: 1px solid #5a4521; margin-bottom: 6px; }
        .btn-delete { background: #a83232 !important; color: #fff; border: none; padding: 5px; cursor: pointer; width: 100%; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- Модальное окно входа по нику -->
    <div id="auth-modal" class="auth-overlay">
        <div class="auth-card">
            <h3>Вход на карту</h3>
            <p style="font-size: 12px;">Введите ваш никнейм для доступа:</p>
            <input type="text" id="user-nickname-input" placeholder="Ваш ник..." />
            <button onclick="loginUser()">Войти</button>
            <p id="auth-error" style="color: #a83232; font-size: 11px; display: none; margin-top: 8px;"></p>
        </div>
    </div>

    <!-- Модальное окно управления пользователями (для админов) -->
    <div id="admin-users-modal" class="auth-overlay" style="display: none;">
        <div class="auth-card" style="width: 360px;">
            <h3>Управление доступом</h3>
            <p style="font-size: 12px; margin-bottom: 6px;">Список одобренных пользователей:</p>
            <div class="users-list" id="users-list-container"></div>
            
            <hr style="border: 0; border-top: 1px solid #5a4521; margin: 10px 0;">
            <p style="font-size: 12px; font-weight: bold;">Добавить нового пользователя:</p>
            <input type="text" id="new-user-name" placeholder="Никнейм..." />
            <select id="new-user-role">
                <option value="reader">Читатель</option>
                <option value="admin">Администратор</option>
            </select>
            <button onclick="addNewUser()">Добавить в список</button>
            <button class="btn-secondary" onclick="closeAdminModal()">Закрыть</button>
        </div>
    </div>

    <!-- Кнопки управления внизу слева -->
    <div class="bottom-left-controls">
        <button id="admin-panel-btn" class="map-control-btn" style="display: none;" onclick="openAdminModal()">🛡️ Управление доступом</button>
        <button id="logout-btn" class="map-control-btn" style="display: none;" onclick="logoutUser()">🚪 Сменить аккаунт</button>
    </div>

    <!-- Левая панель фильтров -->
    <div class="filter-panel" id="filter-panel-box">
        <div class="panel-header">
            <h4>Фильтры</h4>
            <button class="collapse-btn" onclick="toggleLeftPanel()">−</button>
        </div>
        <div class="panel-content">
            <div id="filter-list"></div>
        </div>
    </div>

    <!-- Информационная панель -->
    <div class="info-panel" id="info-panel-box">
        <div class="panel-header">
            <h4>Карта Скайрима</h4>
            <button class="close-btn" onclick="closeInfoPanel()">×</button>
        </div>
        <p>• Пользователь: <b id="current-user-name">-</b></p>
        <p>• Доступ: <b id="current-user-role">-</b></p>
    </div>

    <!-- Правая панель отношений с городами -->
    <div class="diplomacy-panel" id="diplomacy-panel-box">
        <div class="panel-header">
            <h4>Отношения с городами</h4>
            <button class="collapse-btn" onclick="toggleRightPanel()">−</button>
        </div>
        <div class="panel-content">
            <div id="diplomacy-list"></div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBSh4ZeZdHa70PxzIuO84hvC-MUK1LRvPi",
            authDomain: "skyrimmap-6a376.firebaseapp.com",
            databaseURL: "https://skyrimmap-6a376-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "skyrimmap-6a376",
            storageBucket: "skyrimmap-6a376.firebasestorage.app",
            messagingSenderId: "836868606277",
            appId: "1:836868606277:web:fca99b310846f035e4d62c"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = JSON.parse(sessionStorage.getItem('skyrim_active_user')) || null;

        function sanitizeKey(str) {
            return str.replace(/[\.\#\$\[\]]/g, "_").toLowerCase().trim();
        }

        window.loginUser = function() {
            let inputVal = document.getElementById('user-nickname-input').value;
            let key = sanitizeKey(inputVal);
            let errElem = document.getElementById('auth-error');

            if (!key) {
                errElem.textContent = "Пожалуйста, введите никнейм.";
                errElem.style.display = "block";
                return;
            }

            database.ref('allowed_users').once('value').then(snapshot => {
                let users = snapshot.val();

                // Автоматическое создание первого админа (Арунин), если база пустая
                if (!users) {
                    database.ref('allowed_users/арунин').set({ name: "Арунин", role: "admin" });
                    users = { "арунин": { name: "Арунин", role: "admin" } };
                }

                if (users[key]) {
                    currentUser = {
                        key: key,
                        name: users[key].name || inputVal,
                        role: users[key].role || 'reader'
                    };
                    sessionStorage.setItem('skyrim_active_user', JSON.stringify(currentUser));
                    initUserSession();
                } else {
                    errElem.textContent = "Вашего ника нет в списке одобренных лиц!";
                    errElem.style.display = "block";
                }
            });
        };

        window.logoutUser = function() {
            sessionStorage.removeItem('skyrim_active_user');
            currentUser = null;
            location.reload();
        };

        function initUserSession() {
            if (!currentUser) {
                document.getElementById('auth-modal').style.display = 'flex';
                document.getElementById('logout-btn').style.display = 'none';
                document.getElementById('admin-panel-btn').style.display = 'none';
                return;
            }

            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';

            document.getElementById('current-user-name').textContent = currentUser.name;
            document.getElementById('current-user-role').textContent = currentUser.role === 'admin' ? 'Администратор' : 'Читатель';

            if (currentUser.role === 'admin') {
                document.getElementById('admin-panel-btn').style.display = 'block';
            } else {
                document.getElementById('admin-panel-btn').style.display = 'none';
            }

            renderDiplomacyPanel();
            renderMarkers();
        }

        window.openAdminModal = function() {
            if (!currentUser || currentUser.role !== 'admin') return;
            loadUsersList();
            document.getElementById('admin-users-modal').style.display = 'flex';
        };

        window.closeAdminModal = function() {
            document.getElementById('admin-users-modal').style.display = 'none';
        };

        function loadUsersList() {
            database.ref('allowed_users').once('value').then(snapshot => {
                let users = snapshot.val() || {};
                let container = document.getElementById('users-list-container');
                container.innerHTML = '';

                Object.keys(users).forEach(key => {
                    let u = users[key];
                    let roleBadge = u.role === 'admin' ? '🛡️ Админ' : '📖 Читатель';
                    let row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `
                        <span><b>${u.name}</b> (${roleBadge})</span>
                        ${key !== currentUser.key ? `<button class="del-user-btn" onclick="removeUser('${key}')">Удалить</button>` : ''}
                    `;
                    container.appendChild(row);
                });
            });
        }

        window.addNewUser = function() {
            let nameInput = document.getElementById('new-user-name').value.trim();
            let roleInput = document.getElementById('new-user-role').value;
            if (!nameInput) {
                alert("Введите никнейм!");
                return;
            }
            let key = sanitizeKey(nameInput);
            database.ref('allowed_users/' + key).set({
                name: nameInput,
                role: roleInput
            }).then(() => {
                document.getElementById('new-user-name').value = '';
                loadUsersList();
            });
        };

        window.removeUser = function(key) {
            if (confirm("Точно удалить этого пользователя?")) {
                database.ref('allowed_users/' + key).remove().then(() => {
                    loadUsersList();
                });
            }
        };

        // Инициализация карты Leaflet
        var mapWidth = 2000, mapHeight = 1125;
        var map = L.map('map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomSnap: 0.5 });
        var bounds = [[0, 0], [mapHeight, mapWidth]];
        L.imageOverlay('skyrim_map.webp', bounds).addTo(map);
        map.fitBounds(bounds); map.setZoom(-1);

        const citiesList = [
            { type: 'dawnstar', name: 'Данстар', icon: 'Dawnstar.svg' },
            { type: 'falkreath', name: 'Фолкрит', icon: 'Falkreath_undiscovered.svg' },
            { type: 'markarth', name: 'Маркарт', icon: 'Markarth.svg' },
            { type: 'morthal', name: 'Мортал', icon: 'Morthal.svg' },
            { type: 'riften', name: 'Рифтен', icon: 'Riften_undiscovered.svg' },
            { type: 'solitude', name: 'Солитьюд', icon: 'Solitude_undiscovered.svg' },
            { type: 'whiterun', name: 'Вайтран', icon: 'Whiterun.svg' },
            { type: 'windhelm', name: 'Виндхельм', icon: 'Windhelm.svg' },
            { type: 'winterhold', name: 'Винтерхолд', icon: 'Winterhold.svg' }
        ];

        var cityStatuses = {};
        var markersData = [];
        var leafletMarkers = {};

        database.ref('skyrim_markers').on('value', snapshot => {
            markersData = snapshot.val() ? Object.values(snapshot.val()) : [];
            renderMarkers();
        });

        database.ref('city_statuses').on('value', snapshot => {
            cityStatuses = snapshot.val() || {};
            renderDiplomacyPanel();
            renderMarkers();
        });

        function renderDiplomacyPanel() {
            var container = document.getElementById('diplomacy-list');
            container.innerHTML = '';

            citiesList.forEach(city => {
                var currentStatus = cityStatuses[city.type] || 'neutral';
                let cardGlowClass = 'diplo-card-' + currentStatus;
                let statusText = currentStatus === 'ally' ? '🟢 Союзник' : (currentStatus === 'enemy' ? '🔴 Враг' : '🟡 Нейтрал');

                let controlHTML = (currentUser && currentUser.role === 'admin') ? `
                    <select onchange="updateCityStatus('${city.type}', this.value)">
                        <option value='ally' ${currentStatus === 'ally' ? 'selected' : ''}>🟢 Союзник</option>
                        <option value='neutral' ${currentStatus === 'neutral' ? 'selected' : ''}>🟡 Нейтрал</option>
                        <option value='enemy' ${currentStatus === 'enemy' ? 'selected' : ''}>🔴 Враг</option>
                    </select>
                ` : `<span style="font-size: 12px; font-weight: bold;">${statusText}</span>`;

                var div = document.createElement('div');
                div.className = 'city-diplo-item ' + cardGlowClass;
                div.innerHTML = `
                    <div class="city-info">
                        <img src="${city.icon}" class="filter-icon">
                        <span><b>${city.name}</b></span>
                    </div>
                    ${controlHTML}
                `;
                container.appendChild(div);
            });
        }

        window.updateCityStatus = function(cityType, newStatus) {
            if (!currentUser || currentUser.role !== 'admin') return;
            database.ref('city_statuses/' + cityType).set(newStatus);
        };

        function renderMarkers() {
            Object.values(leafletMarkers).forEach(m => map.removeLayer(m));
            leafletMarkers = {};

            markersData.forEach(loc => {
                var marker = L.marker([loc.lat, loc.lng]).addTo(map);
                var popupContent = `
                    <div class='popup-title'>${loc.name}</div>
                    <p>${loc.desc || ''}</p>
                    ${(currentUser && currentUser.role === 'admin') ? `<button class="btn-delete" onclick="deleteMarker(${loc.id})">Удалить метку</button>` : ''}
                `;
                marker.bindPopup(popupContent);
                leafletMarkers[loc.id] = marker;
            });
        }

        map.on('click', function(e) {
            if (!currentUser || currentUser.role !== 'admin') return;
            var lat = e.latlng.lat, lng = e.latlng.lng;
            var name = prompt("Имя метки:");
            if (name) {
                var newId = Date.now();
                database.ref('skyrim_markers/' + newId).set({ id: newId, name: name, lat: lat, lng: lng });
            }
        });

        window.deleteMarker = function(id) {
            if (!currentUser || currentUser.role !== 'admin') return;
            database.ref('skyrim_markers/' + id).remove();
            map.closePopup();
        };

        window.closeInfoPanel = () => document.getElementById('info-panel-box').style.display = 'none';
        window.toggleLeftPanel = () => document.getElementById('filter-panel-box').classList.toggle('collapsed');
        window.toggleRightPanel = () => document.getElementById('diplomacy-panel-box').classList.toggle('collapsed');

        initUserSession();
    </script>
</body>
</html>
